name: Atualizar histórico Lotofácil

on:
  schedule:
    # 00:15 UTC equivale a 21:15 Horário de Brasília (UTC-3)
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # O segredo está aqui: isso ativa o cache automático
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # O cache do setup-python procura por um arquivo chamado requirements.txt
          pip install requests pandas supabase fastapi uvicorn python-dotenv

      - name: 🔄 Atualizar histórico (CSV)
        run: python scripts/atualizar_lotofacil.py

      - name: 🏆 Conferir Jogos (ROI)
        run: python scripts/conferir_resultados.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 📤 Commit automático se houver mudanças
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add data/Lotofacil.csv
          git diff --cached --quiet || (git commit -m "Atualiza histórico e confere jogos" && git push origin main)


