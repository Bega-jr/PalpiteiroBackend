name: Atualizar histórico Lotofácil

on:
  schedule:
    # 00:15 UTC ≈ 21:15 Horário de Brasília
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # 🔑 VARIÁVEIS DISPONÍVEIS PARA TODOS OS SCRIPTS
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase python-dotenv

      - name: 🔄 Atualizar histórico (CSV + Supabase)
        run: python scripts/atualizar_lotofacil.py

      - name: 📤 Commit automático se houver mudanças
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add data/Lotofacil.csv
          git diff --cached --quiet || (
            git commit -m "Atualiza histórico Lotofácil (CSV + Supabase)" &&
            git push origin main
          )

