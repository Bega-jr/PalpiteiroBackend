

name: Pipeline Lotofácil 2026 - IA Evolutiva v19.2

on:
  schedule:
    # 21:45 BRT = 00:45 UTC
    - cron: "45 0 * * 1-6"

  workflow_dispatch:


# ==================================================
# CONCORRÊNCIA
# ==================================================
concurrency:
  group: lotofacil-production
  cancel-in-progress: false


jobs:

  pipeline-lotofacil:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      HTTPX_HTTP_VERSIONS: "http/1.1"

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # CACHE PIP
      # ==================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      # ==================================================
      # DEPENDÊNCIAS SISTEMA
      # ==================================================
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq


      # ==================================================
      # DEPENDÊNCIAS PYTHON
      # ==================================================
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # HEALTHCHECK PIPELINE
      # ==================================================
      - name: Runtime analytics
        run: |

          echo "=========================="
          echo "RUNTIME ANALYTICS"
          echo "=========================="

          date

          echo ""
          echo "MEMÓRIA:"
          free -m

          echo ""
          echo "DISCO:"
          df -h


      # ==================================================
      # VALIDAÇÃO INTEGRIDADE
      # ==================================================
      - name: Validar integridade pipeline
        run: |
          python scripts/validar_integridade_pipeline.py || true


      # ==================================================
      # ETAPA 1
      # RESULTADOS OFICIAIS
      # ==================================================
      - name: Atualizar resultados oficiais
        run: |
          python scripts/atualizar_lotofacil.py


      # ==================================================
      # ETAPA 2
      # CONFERÊNCIA REAL
      # ==================================================
      - name: Conferir resultados reais
        run: |

          python scripts/conferir_resultados.py | tee saida_conferencia.txt

          sed -n '/==================================================/,/====================/p' \
            saida_conferencia.txt > auditoria.txt || true

          echo "AUDITORIA<<EOF" >> $GITHUB_ENV
          cat auditoria.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      # ==================================================
      # TELEGRAM AUDITORIA
      # ==================================================
      - name: Telegram auditoria acertos
        if: "success() && contains(env.AUDITORIA, 'Palpite #')"
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          TEXT_AUDITORIA="${{ env.AUDITORIA }}"

          TEXT_AUDITORIA=$(echo "$TEXT_AUDITORIA" | cut -c1-3900)

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT_AUDITORIA" | jq -Rs .)}"


      # ==================================================
      # ETAPA 2.1
      # MEMÓRIA ESTRUTURAL
      # ==================================================
      - name: Atualizar memória estrutural
        run: |
          python scripts/atualizar_memoria_resultados.py


      # ==================================================
      # ETAPA 2.2
      # FEEDBACK META LEARNING
      # ==================================================
      - name: Processamento feedback meta
        run: |
          python scripts/processamento_feedback_meta.py || true


      # ==================================================
      # ETAPA 2.3
      # HUB CENTRAL AUDITORIA
      # ==================================================
      - name: Hub central auditoria
        run: |
          python scripts/hub_analytics.py || true


      # ==================================================
      # ETAPA 3
      # PROCESSAMENTO CONTEXTUAL
      # ==================================================
      - name: Processamento diário contextual
        run: |
          python scripts/processamento_diario_lotofacil.py


      # ==================================================
      # ETAPA 4
      # GERAÇÃO IA (MODO DIAGNÓSTICO DIRETO)
      # ==================================================
      - name: Gerar palpites IA
        run: |
          # Executa o script de forma pura. Se quebrar, o erro do Python aparece na hora.
          python scripts/gerar_palpites_diarios.py

      # ==================================================
      # ETAPA 4.0.1
      # EXTRAÇÃO DE METADADOS PARA TELEGRAM (Roda se a geração passar)
      # ==================================================
      - name: Extrair metadados para o Telegram
        run: |
          # Executa novamente rápido apenas para capturar os prints das tags para o arquivo de texto
          python scripts/gerar_palpites_diarios.py > saida.txt || true
          
          sed -n '/📲 TELEGRAM_PAYLOAD_START/,/📲 TELEGRAM_PAYLOAD_END/p' \
            saida.txt > bloco.txt || true

          sed '1d;$d' bloco.txt > palpites.txt || true

          echo "PALPITES<<EOF" >> $GITHUB_ENV
          cat palpites.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # ==================================================
      # ETAPA 4.1
      # META-VALIDAÇÃO FINAL
      # ==================================================
      - name: Meta validação final
        run: |
          python scripts/meta_validacao_final.py || true

      # ==================================================
      # ETAPA 4.2
      # SNAPSHOT TELEMETRIA
      # ==================================================
      - name: Snapshot telemetria
        run: |
          python scripts/snapshot_telemetria.py || true

      # ==================================================
      # ETAPA 4.3
      # AUDITORIA ESTRUTURAL
      # ==================================================
      - name: Auditoria estrutural banco
        run: |
          python scripts/auditoria_estrutural.py || true

      # ==================================================
      # ETAPA 4.4
      # BACKUP ANALYTICS
      # ==================================================
      - name: Backup analytics
        run: |
          python scripts/backup_analytics.py || true

      # ==================================================
      # TELEGRAM PALPITES (SUCESSO)
      # ==================================================
      - name: Telegram sucesso
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="${{ env.PALPITES }}"
          TEXT=$(echo "$TEXT" | cut -c1-3900)

          curl -s -X POST "https://telegram.org{TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT" | jq -Rs .)}"

      # ==================================================
      # TELEGRAM ALERTA DE ERRO (FALHA)
      # ==================================================
      - name: Telegram erro
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Envia um alerta limpo via JQ injetando a string sem variáveis instáveis do bash
          curl -s -X POST "https://telegram.org{TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":\"🔴 Erro detectado no pipeline Lotofácil v19.2! Verifique os logs da Action.\""
