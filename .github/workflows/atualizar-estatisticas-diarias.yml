name: Pipeline Lotofácil 2026 - IA Evolutiva

on:
  schedule:
    # 21:45 Brasil = 00:45 UTC
    - cron: "45 0 * * *"
  workflow_dispatch:

jobs:
  pipeline-lotofacil:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz

      - name: 🌐 1. Buscar Resultados Oficiais (CAIXA)
        run: python scripts/atualizar_lotofacil.py

      - name: 🏁 2. Conferir e Alimentar Inteligência (Memória)
        run: python scripts/conferir_resultados.py

      - name: 📊 3. Processamento Diário e Score Real
        run: python scripts/processamento_diario_lotofacil.py

      - name: 🎯 4. Gerar novos palpites (IA Evolutiva)
        run: python scripts/gerar_palpites_diarios.py

      - name: ✅ Finalização
        run: echo "Pipeline executado com sucesso em $(date)"

