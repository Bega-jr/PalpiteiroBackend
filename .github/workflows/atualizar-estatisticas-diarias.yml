name: Atualizar Estatisticas Diarias + Gerar Palpites

on:
  schedule:
    - cron: "45 0 * * *" # 21:45 Horário de Brasília
  workflow_dispatch:

jobs:
  atualizar-supabase:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase python-dotenv requests numpy fastapi

      # ----------------------------
      # 1️⃣ PROCESSAMENTO ESTATÍSTICO
      # ----------------------------
      - name: 📊 Processar Estatísticas Diárias
        run: |
          python scripts/processamento_diario_lotofacil.py

      # ----------------------------
      # 2️⃣ GERAÇÃO DE PALPITES
      # ----------------------------
      - name: 🎯 Gerar Palpites do Dia
        run: |
          python scripts/gerar_palpites_diarios.py

