name: Pipeline Lotofácil 2026 - IA Evolutiva v15.2

on:
  schedule:
    # 📻 Disparo principal (21:45 BRT = 00:45 UTC)
    - cron: "45 0 * * 0-5"
    
  workflow_dispatch:

jobs:
  pipeline-lotofacil:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      HTTPX_HTTP_VERSIONS: "http/1.1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pandas numpy requests python-dotenv supabase pytz scikit-learn httpx

      # =========================
      # ETAPA 1
      # =========================
      - name: Atualizar resultados
        run: python scripts/atualizar_lotofacil.py

      # =========================
      # ETAPA 2 (CONFERÊNCIA COM CAPTURA DE ACERTOS)
      # =====================================================
      - name: Conferência
        run: |
          # Executa salvando o log em arquivo físico
          python scripts/conferir_resultados.py | tee saida_conferencia.txt
          
          # Extrai apenas as linhas de acertos e o bloco de finalização para o resumo do Telegram
          sed -n '/📌/,/====================/p' saida_conferencia.txt > auditoria.txt || true
          
          echo "AUDITORIA<<EOF" >> $GITHUB_ENV
          cat auditoria.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # =====================================================
      # TELEGRAM NOTIFICAÇÃO DE RESULTADO REAIS (SÓ SE HOUVER CONCURSO CONFERIDO)
      # =====================================================
      - name: Telegram auditoria acertos
        if: success() && contains(env.AUDITORIA, 'acertos')
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT_AUDITORIA="📊 *Auditoria de Performance Operacional*

          ${{ env.AUDITORIA }}"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT_AUDITORIA" | jq -Rs .),\"parse_mode\":\"Markdown\"}"

      # =========================
      # ETAPA 2.1
      # =========================
      - name: Memória estrutural
        run: python scripts/atualizar_memoria_resultados.py

      # =========================
      # ETAPA 3
      # =========================
      - name: Processamento
        run: python scripts/processamento_diario_lotofacil.py

      # =========================
      # ETAPA 4
      # =========================
      - name: Gerar palpites
        run: |
          python scripts/gerar_palpites_diarios.py | tee saida.txt
      
          # extrai bloco estruturado de forma segura
          sed -n '/📲 TELEGRAM_PAYLOAD_START/,/📲 TELEGRAM_PAYLOAD_END/p' saida.txt > bloco.txt || true
      
          # filtra apenas linhas válidas
          grep "º" bloco.txt > palpites.txt || true
      
          echo "PALPITES<<EOF" >> $GITHUB_ENV
          cat palpites.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # =========================
      # TELEGRAM PALPITES NOVOS
      # =========================
      - name: Telegram sucesso
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="🟢 *Pipeline Lotofácil concluído! Novos Palpites:*

          ${{ env.PALPITES }}"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT" | jq -Rs .),\"parse_mode\":\"Markdown\"}"

      # =========================
      # TELEGRAM ERRO
      # =========================
      - name: Telegram erro
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="🔴 Erro no pipeline Lotofácil v15.2"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT" | jq -Rs .)}"

