name: Pipeline Lotofácil 2026 - IA Evolutiva v14

on:
  schedule:
    # 21:45 Brasil = 00:45 UTC
    - cron: "45 0 * * *"
  workflow_dispatch:

jobs:
  pipeline-lotofacil:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz

      # -----------------------------------------
      # 1. Resultados oficiais
      # -----------------------------------------
      - name: 🌐 Atualizar resultados oficiais
        run: |
          python scripts/atualizar_lotofacil.py

      # -----------------------------------------
      # 2. Aprendizado real
      # Atualiza score real, acertos,
      # histórico de performance
      # -----------------------------------------
      - name: 🧠 Conferir resultados e aprender
        run: |
          python scripts/conferir_resultados.py

      # -----------------------------------------
      # 3. Processamento estrutural
      # Atualiza:
      # - hash_estrutura
      # - saturação
      # - tendência
      # - regimes
      # -----------------------------------------
      - name: 📊 Processamento estrutural
        run: |
          python scripts/processamento_diario_lotofacil.py

      # -----------------------------------------
      # 4. Geração dos novos jogos
      # -----------------------------------------
      - name: 🎯 Gerar novos palpites
        run: |
          python scripts/gerar_palpites_diarios.py

      # -----------------------------------------
      # Final
      # -----------------------------------------
      - name: ✅ Finalização
        run: |
          echo "Pipeline executado com sucesso em $(date)"
