name: Pipeline Lotofácil 2026 - IA Evolutiva v14

on:
  schedule:
    - cron: "45 0 * * 0-5"
    - cron: "15 2 * * 0-5"
  workflow_dispatch:

jobs:
  pipeline-lotofacil:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      HTTPX_HTTP_VERSIONS: "http/1.1"
      SUPABASE_POSTGREST_CLIENT_TIMEOUT: "60"

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz scikit-learn httpx

      # =========================
      # ETAPA 1
      # =========================
      - name: 🌐 Atualizar resultados oficiais
        run: |
          echo "ETAPA 1"
          python scripts/atualizar_lotofacil.py

      # =========================
      # ETAPA 2
      # =========================
      - name: 🧠 Conferência
        run: |
          echo "ETAPA 2"
          python scripts/conferir_resultados.py

      # =========================
      # ETAPA 2.1 (IMPORTANTE)
      # =========================
      - name: 🔄 Atualizar memória estrutural
        run: |
          echo "ETAPA 2.1"
          python scripts/atualizar_memoria_resultados.py

      # =========================
      # ETAPA 3
      # =========================
      - name: 📊 Processamento
        run: |
          echo "ETAPA 3"
          python scripts/processamento_diario_lotofacil.py

      # =========================
      # ETAPA 4
      # =========================
      - name: 🎯 Gerar palpites
        run: |
          python scripts/gerar_palpites_diarios.py > saida.txt

          tail -n 12 saida.txt > resumo.txt

          echo "LOG_PALPITES<<EOF" >> $GITHUB_ENV
          cat resumo.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # =========================
      # TELEGRAM SUCESSO (CORRIGIDO)
      # =========================
      - name: 📲 Telegram sucesso
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="🟢 Pipeline concluído com sucesso!

${{ env.LOG_PALPITES }}"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT" | jq -Rs .),\"parse_mode\":\"Markdown\"}"

      # =========================
      # TELEGRAM ERRO (CORRIGIDO)
      # =========================
      - name: 🚨 Telegram erro
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="🔴 Erro no pipeline da Lotofácil. Verifique logs do GitHub."

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TG_CHAT_ID}\",\"text\":$(echo "$TEXT" | jq -Rs .),\"parse_mode\":\"Markdown\"}"
