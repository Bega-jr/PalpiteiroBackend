name: Pipeline Lotofácil 2026 - IA Evolutiva v19.2

on:
  schedule:
    
    - cron: "0 03 * * *"

  workflow_dispatch:


# ==================================================
# CONCORRÊNCIA
# ==================================================
concurrency:
  group: lotofacil-production
  cancel-in-progress: false


jobs:

  pipeline-lotofacil:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      HTTPX_HTTP_VERSIONS: "http/1.1"

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # CACHE PIP
      # ==================================================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      # ==================================================
      # DEPENDÊNCIAS SISTEMA
      # ==================================================
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq


      # ==================================================
      # DEPENDÊNCIAS PYTHON
      # ==================================================
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # HEALTHCHECK PIPELINE
      # ==================================================
      - name: Runtime analytics
        run: |

          echo "=========================="
          echo "RUNTIME ANALYTICS"
          echo "=========================="

          date

          echo ""
          echo "MEMÓRIA:"
          free -m

          echo ""
          echo "DISCO:"
          df -h


      # ==================================================
      # VALIDAÇÃO INTEGRIDADE
      # ==================================================
      - name: Validar integridade pipeline
        run: |
          python -m scripts.validar_integridade_pipeline


      # ==================================================
      # ETAPA 1
      # RESULTADOS OFICIAIS
      # ==================================================
      - name: Atualizar resultados oficiais
        run: |
          python scripts/atualizar_lotofacil.py


      # ==================================================
      # ETAPA 2
      # CONFERÊNCIA REAL
      # ==================================================
      - name: Conferir resultados reais
        run: |

          python scripts/conferir_resultados.py | tee saida_conferencia.txt

          sed -n '/==================================================/,/====================/p' \
            saida_conferencia.txt > auditoria.txt || true

          echo "AUDITORIA<<EOF" >> $GITHUB_ENV
          cat auditoria.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      # ==================================================
      # TELEGRAM AUDITORIA
      # ==================================================
      - name: Telegram auditoria acertos
        if: "success() && contains(env.AUDITORIA, 'Palpite #')"
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUDITORIA: ${{ env.AUDITORIA }}
        run: |
          response=$(curl --silent --show-error \
            --connect-timeout 10 \
            --retry 3 \
            --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${AUDITORIA}")

          if ! jq -e '.ok == true' <<< "$response" > /dev/null; then
            jq -r '.description // "Telegram rejected the audit message."' <<< "$response" >&2
            exit 1
          fi


      # ==================================================
      # ETAPA 2.1
      # MEMÓRIA ESTRUTURAL
      # ==================================================
      - name: Atualizar memória estrutural
        run: |
          python scripts/atualizar_memoria_resultados.py


      # ==================================================
      # ETAPA 2.2
      # FEEDBACK META LEARNING
      # ==================================================
      - name: Processamento feedback meta
        run: |
          python scripts/processamento_feedback_meta.py || true


      # ==================================================
      # ETAPA 2.3
      # HUB CENTRAL AUDITORIA
      # ==================================================
      - name: Hub central auditoria
        run: |
          python scripts/hub_analytics.py


      # ==================================================
      # ETAPA 3
      # PROCESSAMENTO CONTEXTUAL
      # ==================================================
      - name: Processamento diário contextual
        run: |
          python scripts/processamento_diario_lotofacil.py


      # ==================================================
      # ETAPA 4
      # GERAÇÃO IA (MODO DIAGNÓSTICO DIRETO)
      # ==================================================
      #- name: Gerar palpites IA
      #  run: |
      #    python scripts/gerar_palpites_diarios.py | tee saida.txt

      # ==================================================
      # ETAPA 4.0.1
      # META-VALIDAÇÃO FINAL (Gera a IA e salva o log textual)
      # ==================================================
      - name: Meta validação final
        run: |
          python scripts/meta_validacao_final.py | tee saida.txt

      # ==================================================
      # ETAPA 4.1
      # EXTRAÇÃO DE METADADOS PARA TELEGRAM (Lê o log do Validador Pai)
      # ==================================================
      - name: Extrair metadados para o Telegram
        run: |
          awk '
            index($0, "📲 TELEGRAM_PAYLOAD_START") { capturing = 1; current = ""; next }
            index($0, "📲 TELEGRAM_PAYLOAD_END") && capturing {
              selected = current
              found = 1
              capturing = 0
              next
            }
            capturing { current = current (length(current) ? "\n" : "") $0 }
            END {
              if (!found) {
                print "Nenhum payload validado foi gerado pelo pipeline."
                print "Revise a etapa Meta validação final nos logs da GitHub Action."
              }
              if (found) {
                printf "%s", selected
              }
            }
          ' saida.txt > palpites.txt

          echo "PALPITES<<EOF" >> $GITHUB_ENV
          cat palpites.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # ==================================================
      # ETAPA 4.2
      # SNAPSHOT TELEMETRIA
      # ==================================================
      - name: Snapshot telemetria
        run: |
          python scripts/snapshot_telemetria.py || true

      # ==================================================
      # ETAPA 4.3
      # AUDITORIA ESTRUTURAL
      # ==================================================
      - name: Auditoria estrutural banco
        run: |
          python scripts/auditoria_estrutural.py || true

      # ==================================================
      # ETAPA 4.4
      # BACKUP ANALYTICS
      # ==================================================
      - name: Backup analytics
        run: |
          python scripts/backup_analytics.py || true

      # ==================================================
      # TELEGRAM PALPITES (SUCESSO - URL CORRIGIDA)
      # ==================================================
      - name: Telegram sucesso
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("TG_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          message = os.environ.get("PALPITES", "").strip()
          if not token or not chat_id or not message:
              raise SystemExit("Telegram credentials or validated payload are missing.")

          max_length = 3500

          def telegram_length(value):
              return len(value.encode("utf-16-le")) // 2

          chunks = []
          current = []
          for line in message.splitlines():
              if telegram_length(line) > max_length:
                  raise SystemExit("A generated Telegram line exceeds the safe message limit.")
              candidate = "\n".join((*current, line))
              if current and telegram_length(candidate) > max_length:
                  chunks.append("\n".join(current))
                  current = [line]
              else:
                  current.append(line)
          if current:
              chunks.append("\n".join(current))

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for index, chunk in enumerate(chunks, start=1):
              payload = json.dumps({"chat_id": chat_id, "text": chunk}).encode()
              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.loads(response.read())
              except urllib.error.HTTPError as error:
                  result = json.loads(error.read())
                  description = result.get("description", "request failed")
                  raise SystemExit(f"Telegram returned HTTP {error.code}: {description}") from None
              except urllib.error.URLError:
                  raise SystemExit("Could not reach the Telegram API.") from None
              if result.get("ok") is not True:
                  raise SystemExit(
                      f"Telegram rejected message {index}/{len(chunks)}: "
                      f"{result.get('description', 'unknown API error')}"
                  )
          print(f"Telegram delivered {len(chunks)} message(s).")
          PY

      # ==================================================
      # TELEGRAM ALERTA DE ERRO (FALHA - URL CORRIGIDA)
      # ==================================================
      - name: Telegram erro
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOK }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TG_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          if not token or not chat_id:
              raise SystemExit("Telegram credentials are missing.")

          message = "🔴 Erro detectado no pipeline Lotofácil v19.7. Verifique os logs da GitHub Action."
          payload = json.dumps({"chat_id": chat_id, "text": message}).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read())
          if result.get("ok") is not True:
              raise SystemExit(result.get("description", "Telegram rejected the failure alert."))
          print("Telegram failure alert delivered.")
          PY
