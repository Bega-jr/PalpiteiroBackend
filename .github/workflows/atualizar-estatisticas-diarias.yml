name: Pipeline Lotofácil 2026 - IA Evolutiva

on:
  schedule:
    # 21:45 Brasil = 00:45 UTC
    - cron: "45 0 * * *"

  workflow_dispatch:

jobs:
  pipeline-lotofacil:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: 📥 Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # =====================================================
      # DEPENDÊNCIAS
      # =====================================================
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy \
            requests \
            python-dotenv \
            supabase


      # =====================================================
      # DEBUG DE CONEXÃO
      # =====================================================
      - name: 🔍 Verificar variáveis
        run: |
          echo "SUPABASE_URL configurada? -> ${SUPABASE_URL:+SIM}"
          echo "SUPABASE_KEY configurada? -> ${SUPABASE_KEY:+SIM}"


      # =====================================================
      # PASSO 1
      # =====================================================
      - name: 📊 Atualizar histórico + estatísticas
        run: |
          python scripts/processamento_diario_lotofacil.py


      # =====================================================
      # PASSO 2
      # =====================================================
      - name: 🏁 Conferir palpites anteriores
        run: |
          python scripts/conferir_resultados.py


      # =====================================================
      # PASSO 3
      # =====================================================
      - name: 🎯 Gerar novos palpites
        run: |
          python scripts/gerar_palpites_diarios.py


      # =====================================================
      # FIM
      # =====================================================
      - name: ✅ Finalização
        run: |
          echo "Pipeline executado com sucesso"
