name: Pipeline Lotofácil 2026 - IA Evolutiva v14

on:
  schedule:
    # 📻 Primeiro disparo (21:45 BRT = 00:45 UTC) - Terça a Domingo UTC (Reflete Seg a Sáb BRT)
    - cron: "45 0 * * 0-5"
    # 🛡️ Disparo de Segurança (23:15 BRT = 02:15 UTC) - Terça a Domingo UTC (Reflete Seg a Sáb BRT)
    - cron: "15 2 * * 0-5"
  workflow_dispatch:

jobs:
  pipeline-lotofacil:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      # Força o HTTPX/Supabase a usar HTTP/1.1 para evitar erros de encerramento de stream do HTTP/2
      HTTPX_HTTP_VERSIONS: "http/1.1"

    steps:

      # =====================================================
      # CHECKOUT & PYTHON SETUP
      # =====================================================
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz scikit-learn httpx

      # =====================================================
      # PIPELINE EXECUTION (ETAPAS 1 A 3)
      # =====================================================
      - name: 🌐 Atualizar resultados oficiais
        run: |
          echo "========================================="
          echo "ETAPA 1 - RESULTADOS OFICIAIS"
          echo "========================================="
          python scripts/atualizar_lotofacil.py

      - name: 🧠 Conferir resultados e aprender
        run: |
          echo "========================================="
          echo "ETAPA 2 - CONFERÊNCIA"
          echo "========================================="
          python scripts/conferir_resultados.py

      - name: 🔄 Atualizar memória estrutural
        run: |
          echo "========================================="
          echo "ETAPA 2.1 - MEMÓRIA ESTRUTURAL"
          echo "========================================="
          python scripts/atualizar_memoria_resultados.py

      - name: 📊 Processamento estrutural
        run: |
          echo "========================================="
          echo "ETAPA 3 - PROCESSAMENTO"
          echo "========================================="
          python scripts/processamento_diario_lotofacil.py

      # =====================================================
      # ETAPA 4 - GERAÇÃO COM CAPTURA DE LOG RESISTENTE
      # =====================================================
      - name: 🎯 Gerar novos palpites e armazenar texto
        run: |
          echo "========================================="
          echo "ETAPA 4 - GERAÇÃO"
          echo "========================================="
          
          python scripts/gerar_palpites_diarios.py > saida_palpites.txt
          cat saida_palpites.txt
          
          python -c "
          with open('saida_palpites.txt', 'r', encoding='utf-8') as f:
              linhas = f.readlines()
          resultado = ''.join(linhas[-12:])
          with open('/tmp/filtrado.txt', 'w', encoding='utf-8') as f2:
              f2.write(resultado)
          "
          
          echo "LOG_PALPITES<<EOF" >> $GITHUB_ENV
          cat /tmp/filtrado.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # =====================================================
      # ENVIO DOS PALPITES VIA PYTHON NATIVO (SÓ SUCESSO)
      # =====================================================
      - name: 📲 Enviar palpites ao Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOK }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('TOKEN')
          chat_id = os.getenv('CHAT_ID')
          log_palpites = os.getenv('LOG_PALPITES', '')
          
          msg = f'🟢 *Pipeline Concluído com Sucesso!*\n\n{log_palpites}'
          url = 'telegram.org' + token + '/sendMessage'
          
          payload = {'chat_id': chat_id, 'text': msg, 'parse_mode': 'Markdown'}
          res = requests.post(url, json=payload)
          print('Resposta Telegram:', res.text)
          assert res.status_code == 200
          "

      # =====================================================
      # ALERTA DE ERRO VIA PYTHON NATIVO (SÓ SE FALHAR)
      # =====================================================
      - name: 🚨 Alerta de erro no Telegram
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOK }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('TOKEN')
          chat_id = os.getenv('CHAT_ID')
          
          msg = '🔴 *Erro Crítico no Pipeline da Lotofácil!*\nA execução quebrou em alguma das etapas. Verifique o painel de ações do GitHub para obter detalhes do log.'
          url = 'telegram.org' + token + '/sendMessage'
          
          payload = {'chat_id': chat_id, 'text': msg, 'parse_mode': 'Markdown'}
          res = requests.post(url, json=payload)
          print('Resposta Telegram:', res.text)
          "

