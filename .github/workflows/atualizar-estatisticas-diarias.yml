name: Pipeline Lotofácil 2026 - IA Evolutiva v14.4

on:
  schedule:
    - cron: "45 0 * * 0-5"
    - cron: "15 2 * * 0-5"
  workflow_dispatch:

jobs:
  pipeline-lotofacil:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      HTTPX_HTTP_VERSIONS: "http/1.1"
      SUPABASE_POSTGREST_CLIENT_TIMEOUT: "60"

    steps:

      # =========================
      # SETUP
      # =========================
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz scikit-learn httpx

      # =========================
      # ETAPA 1
      # =========================
      - name: 🌐 Atualizar resultados oficiais
        run: |
          echo "ETAPA 1"
          python scripts/atualizar_lotofacil.py

      # =========================
      # ETAPA 2
      # =========================
      - name: 🧠 Conferência
        run: |
          echo "ETAPA 2"
          python scripts/conferir_resultados.py

      # =========================
      # ETAPA 2.1 (MEMÓRIA)
      # =========================
      - name: 🔄 Atualizar memória estrutural
        run: |
          echo "ETAPA 2.1"

          # evita crash do pipeline inteiro
          python scripts/atualizar_memoria_resultados.py || echo "⚠️ falha na memória, seguindo pipeline"

      # =========================
      # ETAPA 3
      # =========================
      - name: 📊 Processamento
        run: |
          echo "ETAPA 3"
          python scripts/processamento_diario_lotofacil.py

      # =========================
      # ETAPA 4
      # =========================
      - name: 🎯 Gerar palpites
        run: |
          python scripts/gerar_palpites_diarios.py > saida.txt

          # mais seguro que 12 linhas
          tail -n 40 saida.txt > resumo.txt

          echo "LOG_PALPITES<<EOF" >> $GITHUB_ENV
          cat resumo.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # =========================
      # TELEGRAM - SUCESSO
      # =========================
      - name: 🎯 Gerar palpites
        run: |
          python scripts/gerar_palpites_diarios.py > saida.txt

          tail -n 40 saida.txt > resumo.txt

          {
            echo "LOG_PALPITES<<EOF"
            cat resumo.txt
            echo "EOF"
          } >> $GITHUB_ENV
