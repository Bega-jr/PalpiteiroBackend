name: Pipeline Lotofácil 2026 - IA Evolutiva v14

on:
  schedule:
    # 📻 Primeiro disparo (21:45 BRT = 00:45 UTC) - Terça a Domingo UTC (Reflete Seg a Sáb BRT)
    - cron: "45 0 * * 0-5"
    # 🛡️ Disparo de Segurança (23:15 BRT = 02:15 UTC) - Terça a Domingo UTC (Reflete Seg a Sáb BRT)
    - cron: "15 2 * * 0-5"
  workflow_dispatch:

jobs:
  pipeline-lotofacil:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONPATH: .
      HTTPX_HTTP_VERSIONS: "http/1.1"

    steps:

      # =====================================================
      # CHECKOUT & PYTHON SETUP
      # =====================================================
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz scikit-learn httpx

      # =====================================================
      # PIPELINE EXECUTION (ETAPAS 1 A 3)
      # =====================================================
      - name: 🌐 Atualizar resultados oficiais
        run: |
          echo "========================================="
          echo "ETAPA 1 - RESULTADOS OFICIAIS"
          echo "========================================="
          python scripts/atualizar_lotofacil.py

      - name: 🧠 Conferir resultados e aprender
        run: |
          echo "========================================="
          echo "ETAPA 2 - CONFERÊNCIA"
          echo "========================================="
          python scripts/conferir_resultados.py

      - name: 🔄 Atualizar memória estrutural
        run: |
          echo "========================================="
          echo "ETAPA 2.1 - MEMÓRIA ESTRUTURAL"
          echo "========================================="
          python scripts/atualizar_memoria_resultados.py

      - name: 📊 Processamento estrutural
        run: |
          echo "========================================="
          echo "ETAPA 3 - PROCESSAMENTO"
          echo "========================================="
          python scripts/processamento_diario_lotofacil.py

      # =====================================================
      # ETAPA 4 - GERAÇÃO COM CAPTURA DE LOG RESISTENTE
      # =====================================================
      - name: 🎯 Gerar novos palpites e armazenar texto
        run: |
          echo "========================================="
          echo "ETAPA 4 - GERAÇÃO"
          echo "========================================="
          
          python scripts/gerar_palpites_diarios.py > saida_palpites.txt
          cat saida_palpites.txt
          
          python -c "
          with open('saida_palpites.txt', 'r', encoding='utf-8') as f:
              linhas = f.readlines()
          resultado = ''.join(linhas[-12:])
          with open('/tmp/filtrado.txt', 'w', encoding='utf-8') as f2:
              f2.write(resultado)
          "
          
          echo "LOG_PALPITES<<EOF" >> $GITHUB_ENV
          cat /tmp/filtrado.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # =====================================================
      # ENVIO DOS PALPITES VIA cURL (SÓ SUCESSO)
      # =====================================================
      - name: 📲 Enviar palpites ao Telegram
        if: success()
        run: |
          TEXTO_FINAL=$(cat << 'EOF'
          🟢 *Pipeline Concluído com Sucesso!*
          
          ${{ env.LOG_PALPITES }}
          EOF
          )
          
          # 🛠️ CORREÇÃO: Sintaxe ajustada para usar o prefixo cifrão $ antes dos segredos
          curl -X POST "telegram.org${{ secrets.TELEGRAM_TOK }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": $(echo "$TEXTO_FINAL" | jq -R -s .), \"parse_mode\": \"Markdown\"}"

      # =====================================================
      # ALERTA DE ERRO VIA cURL (SÓ SE FALHAR)
      # =====================================================
      - name: 🚨 Alerta de erro no Telegram
        if: failure()
        run: |
          TEXTO_ERRO="🔴 *Erro Crítico no Pipeline da Lotofácil!* \nA execução quebrou em alguma das etapas. Verifique o painel de ações do GitHub para obter detalhes do log."
          
          # 🛠️ CORREÇÃO: Sintaxe ajustada para usar o prefixo cifrão $ antes dos segredos
          curl -X POST "telegram.org${{ secrets.TELEGRAM_TOK }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"$TEXTO_ERRO\", \"parse_mode\": \"Markdown\"}"
