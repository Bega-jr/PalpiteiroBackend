name: Atualizar Estatisticas Diarias

on:
  schedule:
    - cron: "30 0 * * *" # 21:30 Horário de Brasília
  workflow_dispatch:

jobs:
  atualizar-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # supabase oficial (sem o -py) para 2026
          pip install pandas supabase python-dotenv requests

      - name: Executar Processamento de Estatisticas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/precalcular_estatisticas_numeros.py
          python scripts/precalcular_estatisticas_diarias.py
          python scripts/gerar_estatisticas_diarias.py

