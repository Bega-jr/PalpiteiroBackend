name: Atualizar Estatisticas Diarias

on:
  schedule:
    - cron: "30 0 * * *" # 21:30 Horário de Brasília
  workflow_dispatch:

jobs:
  atualizar-supabase:
    runs-on: ubuntu-latest

    env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # supabase oficial (sem o -py) para 2026
          pip install pandas supabase python-dotenv requests

      - name: Executar Processamento de Estatisticas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }} # Adicione esta linha
          PYTHONPATH: .
        run: |
          python scripts/consolidar_estatisticas_geral.py
          python scripts/precalculo_diario.py
          python scripts/precalcular_palpite_fixo.py
          python scripts/conferir_resultados.py
