name: Conferencia Automatica Lotofacil

on:
  schedule:
    # Roda de segunda a sábado às 21:00h Horário de Brasília
    # No UTC, isso é 00:00h (meia-noite) do dia seguinte
    - cron: '0 0 * * 2-7'
  workflow_dispatch: # Permite que você rode manualmente pelo painel do GitHub

jobs:
  conferir:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de conferência
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Adicione outras variáveis que seu service precise
        run: python main.py
