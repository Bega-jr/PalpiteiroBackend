name: Conferencia Automatica Lotofacil

on:
  schedule:
    # Roda de terça a domingo às 00:00 UTC 
    # (Equivale a segunda a sábado às 21:00 Horário de Brasília)
    - cron: '0 0 * * 0,2,3,4,5,6'
  workflow_dispatch: # Permite execução manual para testes

jobs:
  conferir:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script de conferência
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
