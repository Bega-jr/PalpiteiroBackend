name: Atualizar histórico e estatísticas Lotofácil

on:
  schedule:
    # 00:15 UTC equivale a 21:15 Horário de Brasília (UTC-3)
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PalpiteiroBackend

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: PalpiteiroBackend/requirements.txt

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase fastapi uvicorn python-dotenv

      - name: 🔄 Passo 1: Atualizar histórico (CSV)
        run: python scripts/atualizar_lotofacil.py

      - name: 🏆 Passo 2: Conferir Jogos (ROI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/conferir_resultados.py

      - name: 📊 Passo 3: Processar Estatísticas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/precalcular_estatisticas_numeros.py
          python scripts/precalcular_estatisticas_diarias.py
          python scripts/gerar_estatisticas_diarias.py

      - name: 📤 Passo 4: Commit automático
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add data/Lotofacil.csv
          git diff --cached --quiet || (git commit -m "auto: atualiza historico e estatisticas $(date +'%d/%m/%Y')" && git push origin main)

