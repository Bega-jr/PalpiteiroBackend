name: Pipeline Completa Lotofácil (Dados e Estatísticas)

on:
  schedule:
    # 00:15 UTC = 21:15 Horário de Brasília (UTC-3)
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  processar-lotofacil:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Cache automático baseado no requirements.txt

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Garante a instalação das bibliotecas necessárias de 2026
          pip install requests pandas supabase python-dotenv uvicorn fastapi

      - name: 🔄 Passo 1: Atualizar histórico (CSV)
        # Tenta rodar o script dedicado, se falhar, o pipeline para
        run: python scripts/atualizar_lotofacil.py

      - name: 🏆 Passo 2: Conferir Jogos (ROI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/conferir_resultados.py

      - name: 📊 Passo 3: Executar Estatísticas e Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Processa estatísticas globais e diárias
          python scripts/precalcular_estatisticas.py
          python scripts/precalcular_estatisticas_diarias.py

      - name: 📤 Passo 4: Commit automático no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/Lotofacil.csv
          # Só commita se o arquivo CSV realmente tiver mudado
          if ! git diff --cached --quiet; then
            git commit -m "auto: atualiza histórico e estatísticas $(date +'%d/%m/%Y')"
            git push origin main
          else
            echo "Sem mudanças no CSV para commitar."
          fi
